            "type": "string",
            "pattern": "^-?\\d{1,24}(?:\\.\\d{1,6})?$",
            "nullable": true
          },
          "requestedQuantity": {
            "type": "string",
            "pattern": "^-?\\d{1,24}(?:\\.\\d{1,6})?$"
