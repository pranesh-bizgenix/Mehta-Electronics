            "maxLength": 80
          },
          "correlationId": {
            "type": "string",
            "maxLength": 100
          },
          "details": {
            "type": "object",
            "additionalProperties": true
          }
        },
        "required": [
          "error",
          "code"
        ],
        "additionalProperties": false
      },
      "Freshness": {
        "type": "object",
        "properties": {
          "dataset": {
            "type": "string",
            "maxLength": 80
          },
          "status": {
            "type": "string",
            "maxLength": 80
          },
          "sourceTimestamp": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "lastSuccessfulSync": {
            "type": "string",
            "format": "date-time",
            "nullable": true
          },
          "ageSeconds": {
            "type": "integer",
            "minimum": 0,
            "nullable": true
          }
        },
        "required": [
          "dataset",
          "status",
          "sourceTimestamp",
          "lastSuccessfulSync",
          "ageSeconds"
        ],
        "additionalProperties": false
      },
      "CustomerCandidate": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "name": {
            "type": "string",
            "maxLength": 250
          },
          "gstin": {
            "type": "string",
            "maxLength": 20,
            "nullable": true
          },
          "matchMethods": {
            "type": "array",
            "items": {
              "type": "string",
              "maxLength": 80
            },
            "maxItems": 10
          },
          "confidence": {
            "type": "string",
            "pattern": "^(?:0(?:\\.\\d{1,6})?|1(?:\\.0{1,6})?)$",
            "nullable": true
          },
          "requiresReview": {
            "type": "boolean"
          }
        },
        "required": [
          "id",
          "name",
          "gstin",
          "matchMethods",
          "confidence",
          "requiresReview"
        ],
        "additionalProperties": false
      },
      "Item": {
        "type": "object",
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "partCode": {
            "type": "string",
            "maxLength": 200
          },
          "description": {
            "type": "string",
            "maxLength": 2000
          },
          "unit": {
            "type": "string",
            "maxLength": 40
          },
          "matchedBy": {
            "type": "string",
            "maxLength": 80
          },
          "sourceRecordKey": {
            "type": "string",
            "maxLength": 250,
            "nullable": true
          }
        },
        "required": [
