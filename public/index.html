<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mehta CRM</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23174c36'/%3E%3Cpath d='M15 43V21h7l10 13 10-13h7v22h-7V31L32 44 22 31v12z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/phase2.css">
  <link rel="stylesheet" href="/overview.css?v=overview-2">
  <link rel="stylesheet" href="/design-system.css?v=1">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <main id="login-view" class="login-shell">
    <section class="login-card">
      <div class="brand-mark">ME</div>
      <p class="eyebrow">Mehta Electronics</p>
      <h1>Your workspace, connected.</h1>
      <p class="muted">Secure access to customers, items, Tally reconciliation, and audit history.</p>
      <form id="login-form" class="stack">
        <label>Email<input name="email" type="email" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="primary">Sign in</button>
        <p id="login-error" class="error"></p>
      </form>
    </section>
  </main>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark small">ME</div><div><strong>Mehta Electronics</strong><span>Business workspace</span></div></div>
      <nav id="nav">
        <button data-view="dashboard" data-permission="dashboard.read" class="active">Overview</button>
        <button data-view="customers" data-permission="customers.read">Customers</button>
        <button data-view="items" data-permission="items.read">Items</button>
        <button data-view="enquiries" data-permission="enquiries.read">Enquiries</button>
        <button data-view="quotations" data-permission="quotations.read">Quotations</button>
        <button data-view="orders" data-permission="orders.read">Sales orders</button>
        <button data-view="purchasing" data-permission="purchasing.read">Purchasing</button>
        <button data-view="users" data-permission="users.read">Users</button>
        <button data-view="tally" data-permission="tally.read">Tally & reconciliation</button>
        <button data-view="tally-connector" data-permission="tally.connector.manage">Tally Connector</button>
        <button data-view="audit" data-permission="audit.read">Audit log</button>
      </nav>
      <div class="profile"><div id="avatar" class="avatar"></div><div><strong id="profile-name"></strong><span id="profile-role"></span></div><button id="logout" title="Sign out" aria-label="Sign out">&#8599;</button></div>
    </aside>
    <main class="content">
      <header class="page-header"><button id="menu-toggle" class="secondary menu-toggle" type="button" aria-label="Open navigation" aria-controls="nav" aria-expanded="false">☰</button><div class="page-heading"><p class="eyebrow">Mehta / Workspace</p><h1 id="page-title">Overview</h1><p id="page-description" class="page-description">Your business at a glance.</p></div><div class="header-actions"><span class="read-only-badge">Tally: read only</span><button id="theme-toggle" class="secondary" type="button" aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button></div></header>
      <div id="page-feedback" hidden></div>
      <section id="view" aria-live="polite" tabindex="-1"></section>
    </main>
  </div>

  <dialog id="modal" aria-labelledby="modal-title"><form method="dialog" id="modal-form"><header><h2 id="modal-title"></h2><button type="submit" value="cancel" formnovalidate class="icon modal-cancel" aria-label="Close dialog">&times;</button></header><div id="modal-body"></div><footer><button type="submit" value="cancel" formnovalidate class="secondary modal-cancel">Cancel</button><button id="modal-save" value="default" class="primary">Save</button></footer></form></dialog>
  <script type="module" src="/ui-components.js?v=1"></script>
  <script type="module" src="/app.js?v=overview-2"></script>
</body>
</html>
